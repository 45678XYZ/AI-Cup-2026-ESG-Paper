# Paper2Poster style override for an A0 portrait poster.
# Place next to paper.pdf as {dataset_dir}/{paper_name}/poster.yaml.
# Keys follow Paper2Poster's config/poster.yaml.

main_text_font_size: 54
section_title_font_size: 72
poster_title_font_size: 84
poster_author_font_size: 44

title_text_color: [255, 255, 255]
title_fill_color: [0, 98, 105]

main_text_color: [38, 38, 38]
main_text_fill_color: null

section_title_vertical_align: "middle"
section_title_symbol: ""
